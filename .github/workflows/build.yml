name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: kivy/buildozer-action@master
        with:
          command: buildozer android debug
          buildozer_version: master
          
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
