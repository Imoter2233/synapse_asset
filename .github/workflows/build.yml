name: Build
on: [push, workflow_dispatch]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # UPDATED: Replaced 'libncurses5-dev libncursesw5-dev libtinfo5' with 'libncurses-dev libtinfo6'
          # These are the correct package names for Ubuntu 24.04 +
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          # Cython is pinned to 0.29.33 for Kivy 2.2.1 compatibility
          pip install buildozer "cython==0.29.33" virtualenv

      - name: Build Android APK
        env:
          # Automatically accepts Android SDK licenses
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
