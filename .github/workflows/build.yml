name: Build Synapse APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer (Direct Docker)
        # We use the official image directly to skip the "chown" bug
        uses: docker://kivy/buildozer:master
        with:
          args: buildozer android debug
        env:
          # This variable tells Buildozer it's okay to run as root
          BUILDOZER_ALLOW_KIVY_USER_ROOT: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-Android-Package
          path: bin/*.apk
