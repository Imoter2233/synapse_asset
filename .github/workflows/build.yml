name: Build
on: [push, workflow_dispatch]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04  # <-- THE MAGIC FIX. This bypasses the Ubuntu 24.04 compiler bug!
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Standard robust dependencies for Ubuntu 22.04
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          # We removed the Cython pin so Kivy 2.3.0 can use the newest Cython 3
          pip install buildozer cython virtualenv

      - name: Build Android APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
