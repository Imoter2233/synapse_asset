name: Build Synapse APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: NickSane/buildozer-action@v1
        with:
          buildozer_version: master
          command: buildozer android debug
          # This bypasses the 'chown' issues by running as the runner user
          repository_root: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-APK
          path: bin/*.apk
