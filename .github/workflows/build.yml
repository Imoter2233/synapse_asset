name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer (Docker Strategy)
        uses: docker://kivy/buildozer:master
        with:
          args: buildozer android debug
        env:
          # This ensures Buildozer runs without permission drama
          BUILDOZER_ALLOW_KIVY_USER_ROOT: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
